<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="background-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Budines">
    <meta name="color-scheme" content="dark light">
    <title>Budines</title>
    <link rel="preload" href="/branding/logo-luz-en-ruinas.png" as="image">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="boot-brand" aria-hidden="true">
      <img src="/branding/logo-luz-en-ruinas.png" alt="">
    </div>
    <div class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <img class="brand-logo brand-logo--header" src="/branding/logo-luz-en-ruinas.png" alt="Luz en Ruinas" width="1448" height="1086">
          <div>
            <p class="eyebrow">Budines</p>
            <h1>Registro compartido</h1>
          </div>
        </div>
        <p id="session-badge" class="session-badge" hidden></p>
      </header>

      <main>
        <section id="activation-view" class="panel auth-panel">
          <img class="brand-logo brand-logo--activation" src="/branding/logo-luz-en-ruinas.png" alt="Luz en Ruinas" width="1448" height="1086">
          <div class="panel-heading">
            <p class="eyebrow">Activación</p>
            <h2>Ingresá al dispositivo</h2>
          </div>

          <form id="activation-form" class="stack" novalidate>
            <label class="field">
              <span>Usuario</span>
              <select id="activation-user" name="userName" autocomplete="username" required>
                <option value="Santi">Santi</option>
                <option value="Leandro">Leandro</option>
              </select>
            </label>

            <label class="field">
              <span>Código de activación</span>
              <input
                id="activation-code"
                name="activationCode"
                type="password"
                autocomplete="one-time-code"
                autocapitalize="none"
                spellcheck="false"
                required
              >
            </label>

            <p id="activation-error" class="form-message" role="status"></p>
            <button id="activation-submit" class="primary-button" type="submit">Activar</button>
          </form>
        </section>

        <section id="app-view" hidden>
          <section id="summary-card" class="summary-card" aria-live="polite">
            <p class="eyebrow">Total acumulado</p>
            <p id="summary-total" class="summary-total">$ 0</p>
            <div id="summary-lines" class="summary-lines"></div>
          </section>

          <nav class="view-switcher" aria-label="Secciones">
            <button id="show-entry" class="switch-button is-active" type="button">Carga</button>
            <button id="show-records" class="switch-button" type="button">Registros</button>
          </nav>

          <section id="entry-section" class="panel">
            <div class="panel-heading row-heading">
              <div>
                <p class="eyebrow">Nueva operación</p>
                <h2>Registrar venta</h2>
              </div>
              <button id="logout-button" class="quiet-button" type="button">Salir</button>
            </div>

            <form id="sale-form" class="stack" novalidate>
              <label class="field">
                <span>Gramos</span>
                <input
                  id="grams-input"
                  name="grams"
                  type="text"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  maxlength="12"
                  autocomplete="off"
                  required
                >
              </label>

              <label class="field">
                <span>Importe total</span>
                <input
                  id="amount-input"
                  name="amountArs"
                  type="text"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  maxlength="12"
                  autocomplete="off"
                  required
                >
              </label>

              <p id="amount-preview" class="input-preview" aria-live="polite"></p>
              <p id="sale-error" class="form-message" role="status"></p>
              <button id="sale-submit" class="primary-button" type="submit">Registrar</button>
            </form>
          </section>

          <section id="records-section" class="panel records-panel" hidden>
            <div class="panel-heading row-heading">
              <div>
                <p class="eyebrow">Historial</p>
                <h2>Registros</h2>
              </div>
              <div class="records-heading-side">
                <img class="brand-logo brand-logo--records" src="/branding/logo-luz-en-ruinas.png" alt="Luz en Ruinas" width="1448" height="1086">
                <button id="reload-records" class="quiet-button" type="button">Recargar</button>
              </div>
            </div>

            <p id="records-state" class="records-state" role="status"></p>
            <div id="records-list" class="records-list"></div>
            <button id="load-more-records" class="secondary-button" type="button" hidden>Ver más</button>
          </section>
        </section>
      </main>
    </div>

    <div id="void-dialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="void-title" hidden>
      <div class="dialog-panel">
        <h2 id="void-title">Eliminar registro</h2>
        <p id="void-copy" class="dialog-copy"></p>
        <dl id="void-details" class="dialog-details"></dl>
        <form id="void-form" class="stack" novalidate>
          <label class="field">
            <span>Confirmación</span>
            <input
              id="void-confirmation"
              name="confirmation"
              type="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              required
            >
          </label>
          <p class="input-preview">Escribí ELIMINAR para confirmar la baja lógica.</p>
          <p id="void-error" class="form-message" role="status"></p>
          <div class="dialog-actions">
            <button id="void-cancel" class="quiet-button" type="button">Cancelar</button>
            <button id="void-submit" class="danger-button" type="submit">Eliminar registro</button>
          </div>
        </form>
      </div>
    </div>

    <p id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></p>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
